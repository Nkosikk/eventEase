name: Build and deploy EventEase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventease-production
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  WEB_PROJECT: EventEase/EventEase.csproj
  TEST_PROJECT: EventEase.Tests/EventEase.Tests.csproj
  PUBLISH_DIRECTORY: ${{ github.workspace }}/artifacts/publish
  AZURE_WEBAPP_NAME: EventEase1

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore EventEase.sln

      - name: Build solution
        run: dotnet build EventEase.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build

      - name: Publish web application
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output "${{ env.PUBLISH_DIRECTORY }}"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIRECTORY }}
